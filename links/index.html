<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Raízes - Links</title>
    <!-- Importando a fonte Bodoni Moda -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #c5a059;
            --gold-hover: #dfbc71;
            --text-color: #f4f4f4;
            --text-muted: #9ca3af;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Bodoni Moda', serif;
        }
        
        body {
            background-color: #0d120f;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Fundo com a foto da loja e efeito Blur */
        .bg-loja {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('foto-loja.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(8px);
            transform: scale(1.1);
            z-index: 1;
        }

        /* Camada escura com tom de verde militar */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, rgba(13, 18, 15, 0.88), rgba(8, 12, 10, 0.92));
            z-index: 2;
        }
        
        .container {
            position: relative;
            z-index: 3;
            width: 100%;
            max-width: 440px;
            text-align: center;
            background: rgba(18, 25, 21, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(197, 160, 89, 0.3);
            border-radius: 20px;
            padding: 40px 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
        }
        
        .logo-container {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            border: 2px solid var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #151d18;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            padding: 4px;
        }
        
        h1 {
            font-size: 1.8rem;
            color: var(--gold);
            margin-bottom: 6px;
            letter-spacing: 1.5px;
            font-weight: 700;
        }
        
        p.subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 32px;
            letter-spacing: 0.5px;
            font-style: italic;
        }
        
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #151d18;
            color: var(--text-color);
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 10px;
            border: 1px solid rgba(197, 160, 89, 0.35);
            font-weight: 600;
            font-size: 1.05rem;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }
        
        .link-btn:hover {
            background-color: var(--gold);
            color: #0d120f;
            border-color: var(--gold);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(197, 160, 89, 0.3);
        }
        
        footer {
            margin-top: 36px;
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            line-height: 1.5;
        }

        .cnpj-info {
            margin-top: 8px;
            font-size: 0.7rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <!-- Fundo desfocado com a foto da loja -->
    <div class="bg-loja"></div>
    <div class="overlay"></div>

    <div class="container">
        <!-- Logo em PNG -->
        <div class="logo-container">
            <img src="logo.png" alt="Loja Raízes">
        </div>
        
        <h1>LOJA RAÍZES</h1>
        <p class="subtitle">Moda que conecta gerações</p>
        
        <div class="links-list">
            <a href="https://wa.me/5542999839784" target="_blank" class="link-btn">
                WhatsApp
            </a>
            <a href="https://lojaraizes.vercel.app" target="_blank" class="link-btn">
                Catálogo / Site
            </a>
            <a href="https://instagram.com/maisraizesoficial" target="_blank" class="link-btn">
                Instagram
            </a>
        </div>
        
        <footer>
            Av. Interventor Manoel Ribas, 186 - Centro, Pitanga - PR
            <div class="cnpj-info">
                MALDANER & MAZETTO LTDA | CNPJ: 64.860.761/0001-04<br>
                &copy; Loja Raízes. Todos os direitos reservados.
            </div>
        </footer>
    </div>
</body>
</html>
