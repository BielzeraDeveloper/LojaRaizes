<title>Loja Raízes - Moda Masculina & Feminina</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
    :root {
        --verde: #0d120f;
        --verde-2: #151d18;
        --verde-3: #1c2720;
        --dourado: #c5a059;
        --dourado-claro: #e2c27d;
        --branco: #f7f5ef;
        --cinza: #a7aaa4;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        background: var(--verde);
        color: var(--branco);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px 16px;
        overflow-x: hidden;
        font-family: 'Montserrat', sans-serif;
    }

    /* FUNDO */
    .bg-loja {
        position: fixed;
        inset: -30px;
        background-image: url('foto-loja.jpg');
        background-size: cover;
        background-position: center;
        filter: blur(10px);
        transform: scale(1.08);
        z-index: 0;
    }

    .overlay {
        position: fixed;
        inset: 0;
        background:
            radial-gradient(
                circle at 50% 25%,
                rgba(49, 61, 51, 0.55),
                rgba(8, 12, 10, 0.94) 70%
            );
        z-index: 1;
    }

    /* CONTAINER */
    .container {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 460px;
        padding: 34px 26px 25px;
        text-align: center;

        background: rgba(13, 18, 15, 0.88);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);

        border: 1px solid rgba(197, 160, 89, 0.28);
        border-radius: 24px;

        box-shadow:
            0 25px 70px rgba(0, 0, 0, 0.65),
            inset 0 1px 0 rgba(255,255,255,0.04);
    }

    /* DETALHE SUPERIOR */
    .linha-dourada {
        width: 42px;
        height: 2px;
        background: var(--dourado);
        margin: 0 auto 22px;
        border-radius: 10px;
        box-shadow: 0 0 12px rgba(197,160,89,.25);
    }

    /* LOGO */
    .logo-container {
        width: 108px;
        height: 108px;
        margin: 0 auto 18px;

        border: 1px solid var(--dourado);
        border-radius: 50%;

        display: flex;
        align-items: center;
        justify-content: center;

        background: rgba(21, 29, 24, 0.95);

        box-shadow:
            0 8px 25px rgba(0,0,0,.45),
            0 0 0 5px rgba(197,160,89,.05);
    }

    .logo-container img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        padding: 5px;
    }

    /* TÍTULO */
    h1 {
        font-family: 'Bodoni Moda', serif;
        font-size: 1.85rem;
        font-weight: 700;
        letter-spacing: 2px;
        color: var(--dourado-claro);
        margin-bottom: 5px;
    }

    .subtitle {
        font-family: 'Bodoni Moda', serif;
        font-size: .92rem;
        font-style: italic;
        color: var(--cinza);
        letter-spacing: .5px;
        margin-bottom: 28px;
    }

    /* LINKS */
    .links-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .link-btn {
        position: relative;

        width: 100%;
        min-height: 58px;

        display: flex;
        align-items: center;

        padding: 12px 18px;

        text-decoration: none;
        color: var(--branco);

        background:
            linear-gradient(
                135deg,
                rgba(28,39,32,.96),
                rgba(17,25,20,.96)
            );

        border: 1px solid rgba(197,160,89,.28);
        border-radius: 13px;

        font-family: 'Montserrat', sans-serif;
        font-size: .93rem;
        font-weight: 600;
        letter-spacing: .3px;

        box-shadow:
            0 5px 15px rgba(0,0,0,.25),
            inset 0 1px 0 rgba(255,255,255,.025);

        transition:
            transform .25s ease,
            border-color .25s ease,
            background .25s ease,
            box-shadow .25s ease;
    }

    /* ÍCONE */
    .icon {
        width: 39px;
        height: 39px;

        flex: 0 0 39px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 10px;

        color: var(--dourado-claro);

        background: rgba(197,160,89,.09);
        border: 1px solid rgba(197,160,89,.18);

        margin-right: 13px;

        transition: .25s ease;
    }

    .icon svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
    }

    .link-text {
        flex: 1;
        text-align: left;
    }

    .arrow {
        color: rgba(197,160,89,.55);
        font-size: 18px;
        margin-left: 10px;
        transition: .25s ease;
    }

    .link-btn:hover {
        transform: translateY(-2px);

        border-color: rgba(197,160,89,.65);

        background:
            linear-gradient(
                135deg,
                rgba(43,56,46,.98),
                rgba(20,30,24,.98)
            );

        box-shadow:
            0 9px 22px rgba(0,0,0,.38),
            0 0 18px rgba(197,160,89,.07);
    }

    .link-btn:hover .icon {
        background: rgba(197,160,89,.16);
        border-color: rgba(197,160,89,.35);
    }

    .link-btn:hover .arrow {
        color: var(--dourado-claro);
        transform: translateX(3px);
    }

    /* DESTAQUE WHATSAPP */
    .link-btn.whatsapp .icon {
        color: #d9e7dc;
    }

    /* INSTAGRAM */
    .link-btn.instagram .icon {
        color: #e5c98d;
    }

    /* CATÁLOGO */
    .link-btn.catalogo .icon {
        color: var(--dourado-claro);
    }

    /* DIVISOR */
    .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 26px 0 19px;
        color: rgba(197,160,89,.5);
        font-size: 9px;
        letter-spacing: 2px;
    }

    .divider::before,
    .divider::after {
        content: "";
        height: 1px;
        flex: 1;
        background: rgba(197,160,89,.18);
    }

    /* ENDEREÇO */
    footer {
        color: var(--cinza);
        font-size: .72rem;
        line-height: 1.6;
    }

    .endereco {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        margin-bottom: 9px;
    }

    .endereco svg {
        width: 15px;
        height: 15px;
        color: var(--dourado);
        flex: 0 0 auto;
    }

    .cnpj-info {
        font-size: .62rem;
        line-height: 1.55;
        opacity: .72;
    }

    .copyright {
        margin-top: 4px;
        color: rgba(167,170,164,.65);
    }

    /* MOBILE */
    @media (max-width: 480px) {
        body {
            padding: 14px;
        }

        .container {
            padding: 30px 18px 22px;
            border-radius: 21px;
        }

        .logo-container {
            width: 96px;
            height: 96px;
        }

        h1 {
            font-size: 1.55rem;
        }

        .subtitle {
            margin-bottom: 24px;
        }

        .link-btn {
            min-height: 56px;
        }
    }

    /* REDUÇÃO DE MOVIMENTO */
    @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
            transition: none !important;
        }
    }
</style>
```
