<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAÍZES — Moda Masculina & Feminina — Pitanga/PR</title>
  <meta name="description" content="Loja Raízes em Pitanga/PR. Moda Masculina & Feminina: Beagle, Baumgarten, Aurochs, Farm Rio, Soul, Sly Wear e Hering.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --esmeralda-profundo: #091712;
      --esmeralda-medio: #143326;
      --esmeralda-vibrante: #1e4a38;
      --dourado-champagne: #d4af37;
      --dourado-suave: #c5a059;
      --dourado-gradiente: linear-gradient(135deg, #ebd47a 0%, #b88e28 100%);

      --font-titulo: 'Playfair Display', serif;
      --font-corpo: 'Plus Jakarta Sans', sans-serif;
      --transicao: all 0.25s ease;
      --raio-card: 12px;
      --raio-btn: 6px;
    }

    [data-theme="dark"] {
      --bg-principal: #050806;
      --bg-card: #0d120f;
      --bg-input: #141b16;
      --borda-suave: rgba(197, 160, 89, 0.12);
      --borda-forte: rgba(197, 160, 89, 0.3);
      --texto-primario: #f5f3ef;
      --texto-secundario: #8e9e94;
      --sombra-card: 0 8px 24px rgba(0, 0, 0, 0.6);
      --badge-bg: rgba(212, 175, 55, 0.15);
      --badge-texto: #ebd47a;
    }

    [data-theme="light"] {
      --bg-principal: #f9f7f2;
      --bg-card: #ffffff;
      --bg-input: #f0ebe1;
      --borda-suave: rgba(20, 51, 38, 0.12);
      --borda-forte: rgba(20, 51, 38, 0.25);
      --texto-primario: #0d1410;
      --texto-secundario: #546459;
      --sombra-card: 0 6px 20px rgba(13, 20, 16, 0.07);
      --badge-bg: #143326;
      --badge-texto: #f5f3ef;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: var(--font-corpo);
      background-color: var(--bg-principal);
      color: var(--texto-primario);
      line-height: 1.4;
      padding-bottom: 40px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-principal);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--borda-suave);
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .header-top {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo-img {
      height: 32px;
      width: 32px;
      object-fit: contain;
      border-radius: 50%;
      filter: sepia(1) saturate(3) hue-rotate(5deg) brightness(1.1);
      transition: var(--transicao);
    }

    .logo-marca {
      font-family: var(--font-titulo);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: var(--dourado-gradiente);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-nav {
      display: flex;
      gap: 4px;
      align-items: center;
      margin-left: 20px;
    }

    .btn-nav {
      background: none;
      border: none;
      color: var(--texto-secundario);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 6px;
      transition: var(--transicao);
      text-decoration: none;
    }

    .btn-nav.ativo, .btn-nav:hover {
      color: var(--dourado-champagne);
    }

    .theme-toggle-btn {
      background: transparent;
      border: 1px solid var(--borda-suave);
      color: var(--texto-primario);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transicao);
    }

    .theme-toggle-btn:hover {
      border-color: var(--dourado-champagne);
      background: var(--bg-card);
    }

    .secao-loja {
      max-width: 1200px;
      margin: 16px auto 8px auto;
      padding: 0 12px;
    }

    .banner-loja {
      position: relative;
      width: 100%;
      height: 180px;
      border-radius: var(--raio-card);
      overflow: hidden;
      border: 1px solid var(--borda-suave);
      display: block;
      text-decoration: none;
    }

    .banner-loja img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.6);
      transition: transform 0.3s ease;
    }

    .banner-loja:hover img {
      transform: scale(1.02);
    }

    .banner-conteudo {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 16px;
      background: linear-gradient(to top, rgba(5,8,6,0.85), transparent);
    }

    .banner-titulo {
      font-family: var(--font-titulo);
      font-size: 22px;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .banner-sub {
      font-size: 12px;
      color: var(--dourado-suave);
      letter-spacing: 1px;
    }

    .container-filtros {
      padding: 12px;
      max-width: 1200px;
      margin: 0 auto;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }

    .container-filtros::-webkit-scrollbar { display: none; }

    .filtros-wrapper {
      display: inline-flex;
      gap: 8px;
    }

    .btn-filtro {
      background: var(--bg-card);
      border: 1px solid var(--borda-suave);
      color: var(--texto-secundario);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: var(--transicao);
    }

    .btn-filtro:hover, .btn-filtro.ativo {
      background: var(--esmeralda-medio);
      color: #ffffff;
      border-color: var(--dourado-champagne);
    }

    .grid-produtos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 14px;
      max-width: 1200px;
      margin: 8px auto;
      padding: 0 12px;
    }

    @media (max-width: 600px) {
      .grid-produtos {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        padding: 0 8px;
      }
      .banner-loja { height: 140px; }
    }

    .card-produto {
      background: var(--bg-card);
      border: 1px solid var(--borda-suave);
      border-radius: var(--raio-card);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: var(--sombra-card);
      transition: var(--transicao);
    }

    .card-foto-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      background: var(--bg-input);
      overflow: hidden;
    }

    .card-foto-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .sem-imagem-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--texto-secundario);
      font-size: 11px;
      text-transform: uppercase;
    }

    .badge-marca {
      position: absolute;
      top: 8px;
      left: 8px;
      background: var(--badge-bg);
      color: var(--badge-texto);
      backdrop-filter: blur(6px);
      border: 1px solid var(--borda-forte);
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      z-index: 2;
    }

    .card-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .produto-titulo {
      font-family: var(--font-corpo);
      font-size: 13px;
      font-weight: 600;
      color: var(--texto-primario);
      margin-bottom: 4px;
      line-height: 1.2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .produto-preco {
      font-size: 16px;
      font-weight: 700;
      color: #25d366;
      letter-spacing: 0.3px;
      margin-bottom: 8px;
    }

    .secao-opcoes {
      margin: 6px 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .label-opcao {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--texto-secundario);
    }

    .lista-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .pill-opcao {
      background: var(--bg-input);
      border: 1px solid var(--borda-suave);
      color: var(--texto-primario);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    .pill-opcao.selecionado {
      background: var(--esmeralda-medio);
      color: #ffffff;
      border-color: var(--dourado-champagne);
    }

    .btn-interesse {
      width: 100%;
      background: #25d366;
      color: #000000;
      border: none;
      padding: 10px;
      border-radius: var(--raio-btn);
      font-family: var(--font-corpo);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
      transition: var(--transicao);
    }

    .btn-interesse:hover {
      background: #20ba5a;
      transform: translateY(-1px);
    }

    .btn-whatsapp-flutuante {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #25d366;
      color: #ffffff;
      border-radius: 50px;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      z-index: 1000;
      text-decoration: none;
      transition: transform 0.25s ease, background-color 0.25s ease;
    }

    .btn-whatsapp-flutuante:hover {
      transform: scale(1.08);
      background-color: #20ba5a;
    }

    .btn-whatsapp-flutuante svg {
      width: 28px;
      height: 28px;
      fill: #ffffff;
    }

    footer {
      text-align: center;
      padding: 25px 15px;
      background-color: var(--bg-principal);
      font-size: 12px;
      color: var(--texto-secundario);
      border-top: 1px solid var(--borda-suave);
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <a href="#" class="logo-container">
        <img src="logo.png" alt="Logo Raízes" class="logo-img">
        <span class="logo-marca">RAÍZES</span>
      </a>

      <div class="header-nav">
        <a href="#vitrine" class="btn-nav ativo">Vitrine</a>
        <a href="https://www.google.com/maps/search/?api=1&query=Av.+Interventor+Manoel+Ribas,+186,+Pitanga+-+PR" target="_blank" rel="noopener" class="btn-nav">Visite-nos</a>
      </div>

      <button class="theme-toggle-btn" id="btn-tema" onclick="alternarTema()" title="Alternar Tema">
        <span id="icone-tema">☀️</span>
      </button>
    </div>
  </header>

  <section class="secao-loja" id="visite-nos">
    <a href="https://www.google.com/maps/search/?api=1&query=Av.+Interventor+Manoel+Ribas,+186,+Pitanga+-+PR" target="_blank" rel="noopener" class="banner-loja" title="Ver localização no Google Maps">
      <img src="foto-loja.jpg" alt="Loja Raízes em Pitanga PR" onerror="this.src='https://images.unsplash.com/photo-1441986300917-64674bd600d8?q=80&w=1000&auto=format&fit=crop'">
      <div class="banner-conteudo">
        <h2 class="banner-titulo">Nossa Boutique</h2>
        <p class="banner-sub">Av. Interventor Manoel Ribas, 186 — Pitanga / PR 📍</p>
      </div>
    </a>
  </section>

  <div class="container-filtros" id="vitrine">
    <div class="filtros-wrapper" id="filtro-marcas">
      <button class="btn-filtro ativo" onclick="filtrarMarca('TODAS')">Todas</button>
      <button class="btn-filtro" onclick="filtrarMarca('AUROCHS')">Aurochs</button>
      <button class="btn-filtro" onclick="filtrarMarca('BAUMGARTEN')">Baumgarten</button>
      <button class="btn-filtro" onclick="filtrarMarca('BEAGLE')">Beagle</button>
      <button class="btn-filtro" onclick="filtrarMarca('FARM RIO')">Farm Rio</button>
      <button class="btn-filtro" onclick="filtrarMarca('SOUL')">Soul</button>
      <button class="btn-filtro" onclick="filtrarMarca('SLY WEAR')">Sly Wear</button>
      <button class="btn-filtro" onclick="filtrarMarca('HERING')">Hering</button>
    </div>
  </div>

  <main class="grid-produtos" id="grid-vitrine"></main>

  <a href="https://wa.me/5542999839784?text=Ol%C3%A1!%20Vim%20pelo%20site%20da%20RA%C3%8DZES%20e%20gostaria%20de%20falar%20com%20o%20atendimento." class="btn-whatsapp-flutuante" target="_blank" rel="noopener" title="Falar no WhatsApp">
    <svg viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.705 1.758zm6.637-3.935l.391.232c1.363.81 2.932 1.238 4.531 1.239 5.022 0 9.112-4.089 9.113-9.113-.001-2.433-.948-4.722-2.67-6.444-1.722-1.722-4.011-2.668-6.444-2.668-5.021 0-9.11 4.089-9.112 9.112-.001 1.666.448 3.292 1.3 4.707l.254.419-1.003 3.663 3.743-.982z"/></svg>
  </a>

  <footer>
    <p><strong>© RAÍZES — Moda Masculina & Feminina</strong></p>
    <p style="margin-top: 4px;">MALDANER & MAZETTO LTDA | CNPJ: 64.860.761/0001-64</p>
  </footer>

  <script src="produtos.js?v=2.1"></script>

  <script>
    const NUMERO_WHATSAPP = "5542999839784"; 
    let marcaAtiva = 'TODAS';

    function alternarTema() {
      const html = document.documentElement;
      const icone = document.getElementById('icone-tema');
      
      if (html.getAttribute('data-theme') === 'dark') {
        html.setAttribute('data-theme', 'light');
        icone.textContent = '🌙';
      } else {
        html.setAttribute('data-theme', 'dark');
        icone.textContent = '☀️';
      }
    }

    function filtrarMarca(marca) {
      marcaAtiva = marca;
      document.querySelectorAll('.btn-filtro').forEach(btn => {
        btn.classList.toggle('ativo', btn.innerText.toUpperCase() === marca.toUpperCase() || (marca === 'TODAS' && btn.innerText === 'Todas'));
      });
      renderizarVitrine();
    }

    function selecionarOpcao(btn, classeGrupo) {
      const parent = btn.closest('.' + classeGrupo);
      parent.querySelectorAll('.pill-opcao').forEach(b => b.classList.remove('selecionado'));
      btn.classList.add('selecionado');
    }

    function formatarPreco(valor) {
      return Number(valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function enviarWhatsApp(idProduto) {
      const card = document.getElementById(`prod-card-${idProduto}`);
      const produto = listaProdutos.find(p => p.id === idProduto);

      if (!produto) return;

      const tamEl = card.querySelector('.grupo-tamanhos .pill-opcao.selecionado');
      const corEl = card.querySelector('.grupo-cores .pill-opcao.selecionado');

      const tamanho = tamEl ? tamEl.innerText : 'Não informado';
      const cor = corEl ? corEl.innerText : 'Padrão';

      const textoMsg = `Olá! Tenho interesse na peça da *RAÍZES*:\n\n` +
                       `📌 *${produto.titulo}*${produto.codigo ? ` (${produto.codigo})` : ''}\n` +
                       `🏷️ Marca: ${produto.marca}\n` +
                       `💰 Valor: ${formatarPreco(produto.preco)}\n` +
                       `📏 Tamanho: ${tamanho}\n` +
                       `🎨 Cor: ${cor}\n\n` +
                       `Ainda está disponível na loja física?`;

      const url = `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(textoMsg)}`;
      window.open(url, '_blank');
    }

    function renderizarVitrine() {
      const grid = document.getElementById('grid-vitrine');
      grid.innerHTML = '';

      const produtosExibidos = (typeof listaProdutos !== 'undefined' && Array.isArray(listaProdutos)) ? listaProdutos : [];

      const filtrados = produtosExibidos.filter(p => {
        if (marcaAtiva === 'TODAS') return true;
        return p.marca && p.marca.toUpperCase() === marcaAtiva.toUpperCase();
      });

      if (filtrados.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--texto-secundario); padding: 30px 0; font-size: 13px;">Nenhum produto nesta categoria.</p>`;
        return;
      }

      filtrados.forEach(prod => {
        const card = document.createElement('article');
        card.className = 'card-produto';
        card.id = `prod-card-${prod.id}`;

        const imgMarkup = prod.imagem 
          ? `<img src="${prod.imagem}" alt="${prod.titulo}" loading="lazy">`
          : `<div class="sem-imagem-placeholder">Sem Imagem</div>`;

        const tamanhosList = prod.tamanhos || ['P', 'M', 'G'];
        const tamanhosMarkup = tamanhosList.map((t, idx) => 
          `<button class="pill-opcao ${idx === 0 ? 'selecionado' : ''}" onclick="selecionarOpcao(this, 'grupo-tamanhos')">${t}</button>`
        ).join('');

        const coresList = prod.cores || ['Padrão'];
        const coresMarkup = coresList.map((c, idx) => 
          `<button class="pill-opcao ${idx === 0 ? 'selecionado' : ''}" onclick="selecionarOpcao(this, 'grupo-cores')">${c}</button>`
        ).join('');

        card.innerHTML = `
          <div class="card-foto-wrapper">
            <span class="badge-marca">${prod.marca || 'RAÍZES'}</span>
            ${imgMarkup}
          </div>

          <div class="card-info">
            <div>
              <h3 class="produto-titulo">${prod.titulo}</h3>
              <div class="produto-preco">${formatarPreco(prod.preco)}</div>
            </div>

            <div class="secao-opcoes">
              <div>
                <span class="label-opcao">Tamanho:</span>
                <div class="lista-pills grupo-tamanhos">
                  ${tamanhosMarkup}
                </div>
              </div>

              <div>
                <span class="label-opcao">Cor:</span>
                <div class="lista-pills grupo-cores">
                  ${coresMarkup}
                </div>
              </div>
            </div>

            <button class="btn-interesse" onclick="enviarWhatsApp(${prod.id})">
              Tenho Interesse
            </button>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderizarVitrine();
    });
  </script>
</body>
</html>
