<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAÍZES — Boutique Multimarcas</title>

  <!-- Google Fonts: Playfair Display (Luxo) + Plus Jakarta Sans (Moda/UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       PALETA DE CORES & VARIÁVEIS "RAÍZES" (Elegância Botânica de Luxo)
       ========================================================================== */
    :root {
      /* Marca & Destaques Nobres */
      --esmeralda-profundo: #0f281e;
      --esmeralda-medio: #1b4332;
      --esmeralda-vibrante: #2d6a4f;
      --dourado-champagne: #d4af37;
      --dourado-suave: #c5a059;
      --dourado-gradiente: linear-gradient(135deg, #e6ca65 0%, #b88e28 100%);
      --terracota: #c86d51;
      --farm-coral: #e76f51;

      /* Fontes */
      --font-titulo: 'Playfair Display', serif;
      --font-corpo: 'Plus Jakarta Sans', sans-serif;

      /* Transições & Sombras */
      --transicao: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      --raio-card: 16px;
      --raio-btn: 8px;
    }

    /* TEMA ESCURO (Padrão - Escuro Botânico/Charcoal Quente) */
    [data-theme="dark"] {
      --bg-principal: #0b100d;
      --bg-card: #131a16;
      --bg-input: #1a241f;
      --borda-suave: rgba(197, 160, 89, 0.15);
      --borda-forte: rgba(197, 160, 89, 0.35);
      --texto-primario: #f4f1ea;
      --texto-secundario: #a3b1a8;
      --sombra-card: 0 12px 32px rgba(0, 0, 0, 0.45);
      --sombra-hover: 0 20px 40px rgba(0, 0, 0, 0.6);
      --badge-bg: rgba(212, 175, 55, 0.12);
      --badge-texto: #e6ca65;
    }

    /* TEMA CLARO (Areia / Off-White de Alto Padrão) */
    [data-theme="light"] {
      --bg-principal: #fbf9f5;
      --bg-card: #ffffff;
      --bg-input: #f2eee5;
      --borda-suave: rgba(27, 67, 50, 0.12);
      --borda-forte: rgba(27, 67, 50, 0.25);
      --texto-primario: #121c17;
      --texto-secundario: #526358;
      --sombra-card: 0 10px 28px rgba(15, 40, 30, 0.06);
      --sombra-hover: 0 18px 36px rgba(15, 40, 30, 0.12);
      --badge-bg: #1b4332;
      --badge-texto: #f4f1ea;
    }

    /* ==========================================================================
       RESET & BASE
       ========================================================================== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: var(--font-corpo);
      background-color: var(--bg-principal);
      color: var(--texto-primario);
      line-height: 1.5;
      transition: background-color 0.4s ease, color 0.4s ease;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    /* ==========================================================================
       HEADER & CABEÇALHO
       ========================================================================== */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-principal);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--borda-suave);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: var(--transicao);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-marca {
      font-family: var(--font-titulo);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: var(--dourado-gradiente);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .theme-toggle-btn {
      background: var(--bg-card);
      border: 1px solid var(--borda-forte);
      color: var(--texto-primario);
      padding: 8px 16px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: var(--transicao);
    }

    .theme-toggle-btn:hover {
      border-color: var(--dourado-champagne);
      transform: translateY(-1px);
    }

    /* ==========================================================================
       FILTRO DE MARCAS (Estilo Magazine / Boutique)
       ========================================================================== */
    .container-filtros {
      padding: 24px 20px 10px 20px;
      max-width: 1300px;
      margin: 0 auto;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none; /* Firefox */
    }

    .container-filtros::-webkit-scrollbar { display: none; } /* Chrome/Safari */

    .filtros-wrapper {
      display: inline-flex;
      gap: 10px;
    }

    .btn-filtro {
      background: var(--bg-card);
      border: 1px solid var(--borda-suave);
      color: var(--texto-secundario);
      padding: 10px 22px;
      border-radius: 40px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: var(--transicao);
    }

    .btn-filtro:hover, .btn-filtro.ativo {
      background: var(--esmeralda-medio);
      color: #ffffff;
      border-color: var(--dourado-champagne);
      box-shadow: 0 4px 14px rgba(27, 67, 50, 0.3);
    }

    /* ==========================================================================
       GRID DE PRODUTOS
       ========================================================================== */
    .grid-produtos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 28px;
      max-width: 1300px;
      margin: 20px auto;
      padding: 0 20px;
    }

    /* ==========================================================================
       CARD DO PRODUTO (REESTILIZADO & CORRIGIDO)
       ========================================================================== */
    .card-produto {
      background: var(--bg-card);
      border: 1px solid var(--borda-suave);
      border-radius: var(--raio-card);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: var(--sombra-card);
      transition: var(--transicao);
    }

    .card-produto:hover {
      transform: translateY(-6px);
      box-shadow: var(--sombra-hover);
      border-color: var(--borda-forte);
    }

    /* Container de Imagem Proporcional sem Vazamento */
    .card-foto-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      background: var(--bg-input);
      overflow: hidden;
    }

    .card-foto-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transition: transform 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
      display: block;
    }

    .card-produto:hover .card-foto-wrapper img {
      transform: scale(1.05);
    }

    .sem-imagem-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--texto-secundario);
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: var(--bg-input);
    }

    /* Etiqueta / Badge de Grife */
    .badge-marca {
      position: absolute;
      top: 14px;
      left: 14px;
      background: var(--badge-bg);
      color: var(--badge-texto);
      backdrop-filter: blur(8px);
      border: 1px solid var(--borda-forte);
      padding: 5px 12px;
      border-radius: 30px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      z-index: 2;
    }

    /* Conteúdo do Card */
    .card-info {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .card-header-detalhes {
      margin-bottom: 12px;
    }

    .produto-titulo {
      font-family: var(--font-titulo);
      font-size: 18px;
      font-weight: 600;
      color: var(--texto-primario);
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .produto-preco {
      font-size: 20px;
      font-weight: 700;
      color: var(--dourado-suave);
      letter-spacing: 0.5px;
      margin-top: 4px;
    }

    /* SELETORES DE OPÇÕES (Tamanhos e Cores) */
    .secao-opcoes {
      margin: 14px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .label-opcao {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--texto-secundario);
    }

    .lista-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .pill-opcao {
      background: var(--bg-input);
      border: 1px solid var(--borda-suave);
      color: var(--texto-primario);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transicao);
    }

    .pill-opcao:hover, .pill-opcao.selecionado {
      background: var(--esmeralda-medio);
      color: #ffffff;
      border-color: var(--dourado-champagne);
    }

    /* BOTÃO WHATSAPP / TENHO INTERESSE (Elegante & Nobre) */
    .btn-interesse {
      width: 100%;
      background: linear-gradient(135deg, var(--esmeralda-medio) 0%, var(--esmeralda-profundo) 100%);
      color: #ffffff;
      border: 1px solid var(--dourado-suave);
      padding: 14px;
      border-radius: var(--raio-btn);
      font-family: var(--font-corpo);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
      transition: var(--transicao);
      box-shadow: 0 4px 12px rgba(15, 40, 30, 0.2);
    }

    .btn-interesse:hover {
      background: linear-gradient(135deg, var(--esmeralda-vibrante) 0%, var(--esmeralda-medio) 100%);
      border-color: var(--dourado-champagne);
      box-shadow: 0 6px 18px rgba(45, 106, 79, 0.35);
      transform: translateY(-2px);
    }

    .btn-interesse svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo-container">
      <span class="logo-marca">RAÍZES</span>
    </div>
    <button class="theme-toggle-btn" id="btn-tema" onclick="alternarTema()">
      🌙 <span id="label-tema">Escuro</span>
    </button>
  </header>

  <!-- FILTRO DE MARCAS -->
  <div class="container-filtros">
    <div class="filtros-wrapper" id="filtro-marcas">
      <button class="btn-filtro ativo" onclick="filtrarMarca('TODAS')">Todas</button>
      <button class="btn-filtro" onclick="filtrarMarca('FARM RIO')">Farm Rio</button>
      <button class="btn-filtro" onclick="filtrarMarca('BEAGLE')">Beagle</button>
      <button class="btn-filtro" onclick="filtrarMarca('BAUMGARTEN')">Baumgarten</button>
      <button class="btn-filtro" onclick="filtrarMarca('SOUL')">Soul</button>
    </div>
  </div>

  <!-- VITRINE DE PRODUTOS -->
  <main class="grid-produtos" id="grid-vitrine">
    <!-- Cards inseridos dinamicamente via JS -->
  </main>

  <!-- ARQUIVO DE PRODUTOS DA LOJA -->
  <script src="produtos.js?v=2.0"></script>

  <script>
    const NUMERO_WHATSAPP = "5542999999999"; // Substitua pelo seu WhatsApp oficial (DDI+DDD+Numero)
    let marcaAtiva = 'TODAS';

    // Alternar Tema Escuro / Claro
    function alternarTema() {
      const html = document.documentElement;
      const btnLabel = document.getElementById('label-tema');
      
      if (html.getAttribute('data-theme') === 'dark') {
        html.setAttribute('data-theme', 'light');
        btnLabel.textContent = 'Claro';
      } else {
        html.setAttribute('data-theme', 'dark');
        btnLabel.textContent = 'Escuro';
      }
    }

    // Filtro por marca
    function filtrarMarca(marca) {
      marcaAtiva = marca;
      document.querySelectorAll('.btn-filtro').forEach(btn => {
        btn.classList.toggle('ativo', btn.innerText.toUpperCase() === marca.toUpperCase() || (marca === 'TODAS' && btn.innerText === 'Todas'));
      });
      renderizarVitrine();
    }

    // Seleção visual de Tamanho / Cor no Card
    function selecionarOpcao(btn, classeGrupo) {
      const parent = btn.closest('.' + classeGrupo);
      parent.querySelectorAll('.pill-opcao').forEach(b => b.classList.remove('selecionado'));
      btn.classList.add('selecionado');
    }

    // Formatação de Preço para Real R$
    function formatarPreco(valor) {
      return Number(valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    // Gerar Link do WhatsApp
    function enviarWhatsApp(idProduto) {
      const card = document.getElementById(`prod-card-${idProduto}`);
      const produto = listaProdutos.find(p => p.id === idProduto);

      if (!produto) return;

      const tamEl = card.querySelector('.grupo-tamanhos .pill-opcao.selecionado');
      const corEl = card.querySelector('.grupo-cores .pill-opcao.selecionado');

      const tamanho = tamEl ? tamEl.innerText : 'Não informado';
      const cor = corEl ? corEl.innerText : 'Padrão';

      const textoMsg = `Olá! Tenho interesse na peça da *RAÍZES*:\n\n` +
                       `📌 *${produto.titulo}* (${produto.codigo})\n` +
                       `🏷️ Marca: ${produto.marca}\n` +
                       `💰 Valor: ${formatarPreco(produto.preco)}\n` +
                       `📏 Tamanho: ${tamanho}\n` +
                       `🎨 Cor: ${cor}`;

      const url = `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(textoMsg)}`;
      window.open(url, '_blank');
    }

    // Renderizar Cards da Vitrine
    function renderizarVitrine() {
      const grid = document.getElementById('grid-vitrine');
      grid.innerHTML = '';

      const produtosExibidos = (typeof listaProdutos !== 'undefined' && Array.isArray(listaProdutos)) ? listaProdutos : [];

      const filtrados = produtosExibidos.filter(p => {
        if (marcaAtiva === 'TODAS') return true;
        return p.marca && p.marca.toUpperCase() === marcaAtiva.toUpperCase();
      });

      if (filtrados.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--texto-secundario); padding: 40px 0;">Nenhum produto disponível no momento nesta categoria.</p>`;
        return;
      }

      filtrados.forEach(prod => {
        const card = document.createElement('article');
        card.className = 'card-produto';
        card.id = `prod-card-${prod.id}`;

        // Trata imagem para evitar overflow
        const imgMarkup = prod.imagem 
          ? `<img src="${prod.imagem}" alt="${prod.titulo}" loading="lazy">`
          : `<div class="sem-imagem-placeholder">Foto Indisponível</div>`;

        // Renderiza botões de tamanhos
        const tamanhosList = prod.tamanhos || ['P', 'M', 'G'];
        const tamanhosMarkup = tamanhosList.map((t, idx) => 
          `<button class="pill-opcao ${idx === 0 ? 'selecionado' : ''}" onclick="selecionarOpcao(this, 'grupo-tamanhos')">${t}</button>`
        ).join('');

        // Renderiza botões de cores
        const coresList = prod.cores || ['Padrão'];
        const coresMarkup = coresList.map((c, idx) => 
          `<button class="pill-opcao ${idx === 0 ? 'selecionado' : ''}" onclick="selecionarOpcao(this, 'grupo-cores')">${c}</button>`
        ).join('');

        card.innerHTML = `
          <div class="card-foto-wrapper">
            <span class="badge-marca">${prod.marca || 'RAÍZES'}</span>
            ${imgMarkup}
          </div>

          <div class="card-info">
            <div class="card-header-detalhes">
              <h3 class="produto-titulo">${prod.titulo}</h3>
              <div class="produto-preco">${formatarPreco(prod.preco)}</div>
            </div>

            <div class="secao-opcoes">
              <div>
                <span class="label-opcao">Tamanho</span>
                <div class="lista-pills grupo-tamanhos" style="margin-top: 4px;">
                  ${tamanhosMarkup}
                </div>
              </div>

              <div>
                <span class="label-opcao">Cor</span>
                <div class="lista-pills grupo-cores" style="margin-top: 4px;">
                  ${coresMarkup}
                </div>
              </div>
            </div>

            <button class="btn-interesse" onclick="enviarWhatsApp(${prod.id})">
              <svg viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.705 1.758zm6.637-3.935l.391.232c1.363.81 2.932 1.238 4.531 1.239 5.022 0 9.112-4.089 9.113-9.113-.001-2.433-.948-4.722-2.67-6.444-1.722-1.722-4.011-2.668-6.444-2.668-5.021 0-9.11 4.089-9.112 9.112-.001 1.666.448 3.292 1.3 4.707l.254.419-1.003 3.663 3.743-.982z"/></svg>
              Tenho Interesse
            </button>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    // Inicialização ao carregar a página
    document.addEventListener('DOMContentLoaded', () => {
      renderizarVitrine();
    });
  </script>
</body>
</html>
