<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin — Raízes Boutique</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --cor-fundo: #070908;
      --cor-card: #111513;
      --cor-card-sub: #161c19;
      --cor-borda: rgba(255, 255, 255, 0.08);
      --cor-borda-foco: #25d366;
      --cor-texto: #f3f5f4;
      --cor-texto-mutado: #808e86;
      --cor-verde: #25d366;
      --cor-verde-hover: #1eb956;
      --cor-verde-glow: rgba(37, 211, 102, 0.2);
      --cor-dourado: #c5a059;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--cor-fundo);
      color: var(--cor-texto);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }

    .painel-container {
      width: 100%;
      max-width: 920px;
      background: var(--cor-card);
      border: 1px solid var(--cor-borda);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .header-painel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--cor-borda);
    }

    .header-painel h2 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-status {
      font-size: 11px;
      font-weight: 700;
      color: var(--cor-dourado);
      background: rgba(197, 160, 89, 0.12);
      border: 1px solid rgba(197, 160, 89, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .config-github {
      background: var(--cor-card-sub);
      border: 1px solid var(--cor-borda);
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 28px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .camera-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
    }

    @media (max-width: 768px) { 
      .painel-container { padding: 20px; }
      .camera-grid { grid-template-columns: 1fr; } 
    }

    .midia-box {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--cor-borda);
      background: #000;
    }

    video, canvas, #foto-preview {
      width: 100%;
      height: 300px;
      border-radius: 12px;
      background: #000;
      object-fit: cover;
      display: block;
    }

    .form-grupo { display: flex; flex-direction: column; gap: 14px; }

    .grid-2-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .campo-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .campo-item label {
      font-size: 11px;
      font-weight: 700;
      color: var(--cor-texto-mutado);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    input {
      background: var(--cor-card-sub);
      border: 1px solid var(--cor-borda);
      padding: 12px 14px;
      color: var(--cor-texto);
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      width: 100%;
      transition: all 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--cor-borda-foco);
      box-shadow: 0 0 12px var(--cor-verde-glow);
    }

    input[readonly] {
      opacity: 0.75;
      cursor: not-allowed;
      border-style: dashed;
    }

    .input-preco {
      font-weight: 700;
      color: #00e676;
      font-size: 15px;
    }

    .btn {
      background: var(--cor-verde);
      color: #05140b;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 13px;
      letter-spacing: 0.5px;
      text-align: center;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px var(--cor-verde-glow);
    }

    .btn:disabled {
      background: #2a332d;
      color: #606d65;
      box-shadow: none;
      cursor: not-allowed;
    }

    .btn-foto { 
      background: #ffffff; 
      color: #000000; 
      margin-top: 10px; 
      box-shadow: none; 
      font-weight: 700;
    }

    .btn:hover:not(:disabled) { 
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .controles-foto {
      display: flex;
      gap: 10px;
    }

    .controles-foto > * {
      flex: 1;
    }
  </style>
</head>
<body>

  <div id="admin-panel" class="painel-container">
    <div class="header-painel">
      <h2>📷 Cadastrar Produto</h2>
      <span class="badge-status">GitHub Auto-Sync</span>
    </div>

    <div class="config-github">
      <div class="campo-item">
        <label>Usuário GitHub</label>
        <input type="text" id="gh-user" placeholder="seu-usuario" onchange="salvarCredenciais()">
      </div>
      <div class="campo-item">
        <label>Repositório</label>
        <input type="text" id="gh-repo" placeholder="nome-do-repo" onchange="salvarCredenciais()">
      </div>
      <div class="campo-item">
        <label>Token de Acesso</label>
        <input type="password" id="gh-token" placeholder="ghp_..." onchange="salvarCredenciais()">
      </div>
    </div>

    <div class="camera-grid">
      <div>
        <div class="midia-box">
          <video id="webcam" autoplay playsinline></video>
        </div>
        <div class="controles-foto">
          <button class="btn btn-foto" onclick="tirarFoto()">📸 Câmera</button>
          <label class="btn btn-foto" style="cursor: pointer; display: inline-block;">
            📁 Arquivo
            <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="carregarFotoArquivo(event)">
          </label>
        </div>
        <canvas id="canvas" style="display:none;"></canvas>
      </div>

      <div class="form-grupo">
        <div class="midia-box">
          <img id="foto-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='400' viewBox='0 0 300 400'><rect width='100%' height='100%' fill='%23111'/><text x='50%' y='50%' fill='%23555' font-size='14' text-anchor='middle'>Aguardando Foto...</text></svg>" alt="Preview">
        </div>
        
        <div class="grid-2-col">
          <div class="campo-item">
            <label>Código Gerado</label>
            <input type="text" id="prod-codigo" readonly>
          </div>

          <div class="campo-item">
            <label>Marca</label>
            <input type="text" id="prod-marca" placeholder="Ex: Beagle">
          </div>
        </div>

        <div class="campo-item">
          <label>Nome do Produto</label>
          <input type="text" id="prod-titulo" placeholder="Ex: Camiseta Linho Casual">
        </div>

        <div class="grid-2-col">
          <div class="campo-item">
            <label>Preço de Venda (R$)</label>
            <input type="text" id="prod-preco" class="input-preco" placeholder="189,90">
          </div>

          <div class="campo-item">
            <label>Tamanhos</label>
            <input type="text" id="prod-tamanhos" placeholder="P, M, G, GG">
          </div>
        </div>
        
        <button id="btn-publicar" class="btn" style="margin-top: 6px;" onclick="cadastrarEEnviarParaGithub()">🚀 Publicar Produto</button>
      </div>
    </div>
  </div>

  <script src="produtos.js"></script>

  <script>
    let imagemBase64 = '';
    let streamCamera = null;
    const IMGBB_API_KEY = '58bb89f2c226df64c69556056d14d355';

    window.addEventListener('DOMContentLoaded', () => {
      carregarCredenciais();
      iniciarCamera();
      gerarNovoCodigo();
    });

    function salvarCredenciais() {
      localStorage.setItem('gh_user', document.getElementById('gh-user').value);
      localStorage.setItem('gh_repo', document.getElementById('gh-repo').value);
      localStorage.setItem('gh_token', document.getElementById('gh-token').value);
    }

    function carregarCredenciais() {
      document.getElementById('gh-user').value = localStorage.getItem('gh_user') || '';
      document.getElementById('gh-repo').value = localStorage.getItem('gh_repo') || '';
      document.getElementById('gh-token').value = localStorage.getItem('gh_token') || '';
    }

    async function iniciarCamera() {
      try {
        const video = document.getElementById('webcam');
        streamCamera = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: "environment", width: { ideal: 1080 }, height: { ideal: 1440 } } 
        });
        video.srcObject = streamCamera;
      } catch (err) {
        console.warn("Câmera não disponível ou permissão negada:", err.message);
      }
    }

    function gerarNovoCodigo() {
      document.getElementById('prod-codigo').value = 'RAIZ-' + Math.floor(1000 + Math.random() * 9000);
    }

    function tirarFoto() {
      const video = document.getElementById('webcam');
      const canvas = document.getElementById('canvas');
      const preview = document.getElementById('foto-preview');

      if (!video.videoWidth) {
        alert("Câmera não está pronta ou indisponível.");
        return;
      }

      canvas.width = video.videoWidth || 600;
      canvas.height = video.videoHeight || 800;
      
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      imagemBase64 = canvas.toDataURL('image/jpeg', 0.85);
      preview.src = imagemBase64;
    }

    function carregarFotoArquivo(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        imagemBase64 = e.target.result;
        document.getElementById('foto-preview').src = imagemBase64;
      };
      reader.readAsDataURL(file);
    }

    // Função interna para comprimir a imagem no navegador antes do upload
    function comprimirBase64(base64, maxLargura = 800, qualidade = 0.75) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;

          if (width > maxLargura) {
            height = Math.round((height * maxLargura) / width);
            width = maxLargura;
          }

          canvas.width = width;
          canvas.height = height;

          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          resolve(canvas.toDataURL('image/jpeg', qualidade));
        };
        img.onerror = () => resolve(base64);
        img.src = base64;
      });
    }

    // Função para upload direto da foto no ImgBB (com compressão automática)
    async function uploadFotoImgBB(base64Data) {
      const base64Comprimido = await comprimirBase64(base64Data, 800, 0.75);
      const fotoPura = base64Comprimido.replace(/^data:image\/(png|jpeg|jpg|webp);base64,/, "");
      
      const formData = new FormData();
      formData.append('key', IMGBB_API_KEY);
      formData.append('image', fotoPura);

      const response = await fetch('https://api.imgbb.com/1/upload', {
        method: 'POST',
        body: formData
      });

      const data = await response.json();
      if (!response.ok || !data.success) {
        throw new Error(data.error?.message || 'Falha ao enviar foto para o servidor de imagem.');
      }

      return data.data.url;
    }

    // Função principal de cadastro
    async function cadastrarEEnviarParaGithub() {
      const btnPublicar = document.getElementById('btn-publicar');
      const user = document.getElementById('gh-user').value.trim();
      const repo = document.getElementById('gh-repo').value.trim();
      const token = document.getElementById('gh-token').value.trim();

      const codigo = document.getElementById('prod-codigo').value;
      const titulo = document.getElementById('prod-titulo').value.trim() || 'Produto Raízes';
      const marca = document.getElementById('prod-marca').value.trim() || 'RAÍZES';
      
      const precoInput = document.getElementById('prod-preco').value.replace(',', '.');
      const preco = parseFloat(precoInput) || 0.00;

      const tamanhosBrutos = document.getElementById('prod-tamanhos').value;
      const tamanhos = tamanhosBrutos ? tamanhosBrutos.split(',').map(t => t.trim()) : ["P", "M", "G"];

      if (!user || !repo || !token) {
        alert('Preencha todas as credenciais do GitHub!');
        return;
      }

      if (!imagemBase64) {
        alert('Selecione uma imagem do dispositivo ou tire uma foto!');
        return;
      }

      btnPublicar.disabled = true;

      try {
        btnPublicar.innerText = '⏳ Comprimindo & Hospedando Foto...';
        const urlFotoExterna = await uploadFotoImgBB(imagemBase64);

        btnPublicar.innerText = '⏳ Atualizando catálogo no GitHub...';
        let listaAtual = [];
        let produtosSha = undefined;
        const urlProdutos = `https://api.github.com/repos/${user}/${repo}/contents/produtos.js`;

        const resProdutos = await fetch(urlProdutos, { 
          headers: { 'Authorization': `bearer ${token}`, 'Accept': 'application/vnd.github+json' },
          cache: 'no-store' 
        });

        if (resProdutos.ok) {
          const dadosProdutos = await resProdutos.json();
          produtosSha = dadosProdutos.sha;
          const conteudoDecodificado = decodeURIComponent(escape(atob(dadosProdutos.content)));
          
          const match = conteudoDecodificado.match(/const\s+listaProdutos\s*=\s*(\[\s*[\s\S]*\s*]);?/);
          if (match && match[1]) {
            listaAtual = JSON.parse(match[1]);
          }
        }

        if (!Array.isArray(listaAtual)) {
          listaAtual = (typeof listaProdutos !== 'undefined' && Array.isArray(listaProdutos)) ? listaProdutos : [];
        }

        const novoProduto = {
          id: Date.now(),
          codigo: codigo,
          titulo: titulo,
          marca: marca,
          preco: preco,
          imagem: urlFotoExterna,
          tamanhos: tamanhos,
          cores: ["Padrão"]
        };

        listaAtual.unshift(novoProduto);

        const conteudoProdutosJS = `const listaProdutos = ${JSON.stringify(listaAtual, null, 2)};`;
        const jsBase64 = btoa(unescape(encodeURIComponent(conteudoProdutosJS)));

        const responseJs = await fetch(urlProdutos, {
          method: 'PUT',
          headers: { 
            'Authorization': `bearer ${token}`, 
            'Content-Type': 'application/json',
            'Accept': 'application/vnd.github+json'
          },
          body: JSON.stringify({ 
            message: `Adiciona ${codigo} com preço R$ ${preco}`, 
            content: jsBase64,
            sha: produtosSha 
          })
        });

        if (!responseJs.ok) {
          const errData = await responseJs.json().catch(() => ({}));
          throw new Error(errData.message || 'Falha ao gravar o arquivo produtos.js no repositório.');
        }

        alert(`Sucesso! O produto ${codigo} foi publicado.`);
        
        document.getElementById('prod-titulo').value = '';
        document.getElementById('prod-preco').value = '';
        document.getElementById('prod-tamanhos').value = '';
        document.getElementById('foto-preview').src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='400' viewBox='0 0 300 400'><rect width='100%' height='100%' fill='%23111'/><text x='50%' y='50%' fill='%23555' font-size='14' text-anchor='middle'>Aguardando Foto...</text></svg>";
        imagemBase64 = '';
        gerarNovoCodigo();

      } catch (error) {
        console.error("Erro no processo de publicação:", error);
        alert(`❌ Erro ao publicar: ${error.message}`);
      } finally {
        btnPublicar.disabled = false;
        btnPublicar.innerText = '🚀 Publicar Produto';
      }
    }
  </script>
</body>
</html>
