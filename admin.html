<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NÂO ENCOSTE EM NADA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --cor-fundo: #0a0a0a;
      --cor-card: #161616;
      --cor-borda: #2a2a2a;
      --cor-texto: #ffffff;
      --cor-verde: #25d366;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--cor-fundo);
      color: var(--cor-texto);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .painel-container {
      display: block;
      width: 100%;
      max-width: 900px;
      background: var(--cor-card);
      border: 1px solid var(--cor-borda);
      border-radius: 16px;
      padding: 25px;
    }

    .config-github {
      background: #111;
      border: 1px dashed var(--cor-borda);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
    }

    .camera-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) { .camera-grid { grid-template-columns: 1fr; } }

    video, canvas, #foto-preview {
      width: 100%;
      height: 280px;
      border-radius: 8px;
      background: #000;
      object-fit: cover;
    }

    .form-grupo { display: flex; flex-direction: column; gap: 10px; }

    .campo-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .campo-item label {
      font-size: 11px;
      font-weight: 600;
      color: #aaa;
      text-transform: uppercase;
    }

    input {
      background: #222;
      border: 1px solid var(--cor-borda);
      padding: 10px 12px;
      color: #fff;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      width: 100%;
    }

    input:focus {
      outline: none;
      border-color: var(--cor-verde);
    }

    .input-preco {
      font-weight: 700;
      color: #00e676;
      font-size: 16px;
    }

    .btn {
      background: var(--cor-verde);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 13px;
      text-align: center;
    }

    .btn-foto { background: #ffffff; color: #000000; margin-top: 8px; }
    .btn:hover { opacity: 0.9; }

    .controles-foto {
      display: flex;
      gap: 10px;
    }

    .controles-foto > * {
      flex: 1;
    }
  </style>
</head>
<body>

  <div id="admin-panel" class="painel-container">
    <div style="margin-bottom: 20px;">
      <h2>📷 Cadastrar Produto (GitHub)</h2>
    </div>

    <div class="config-github">
      <div class="campo-item">
        <label>Usuário GitHub</label>
        <input type="text" id="gh-user" placeholder="seu-usuario" onchange="salvarCredenciais()">
      </div>
      <div class="campo-item">
        <label>Repositório</label>
        <input type="text" id="gh-repo" placeholder="nome-do-repo" onchange="salvarCredenciais()">
      </div>
      <div class="campo-item">
        <label>Token de Acesso</label>
        <input type="password" id="gh-token" placeholder="ghp_..." onchange="salvarCredenciais()">
      </div>
    </div>

    <div class="camera-grid">
      <div>
        <video id="webcam" autoplay playsinline></video>
        <div class="controles-foto">
          <button class="btn btn-foto" onclick="tirarFoto()">📸 Câmera</button>
          <label class="btn btn-foto" style="cursor: pointer; display: inline-block;">
            📁 Arquivo
            <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="carregarFotoArquivo(event)">
          </label>
        </div>
        <canvas id="canvas" style="display:none;"></canvas>
      </div>

      <div class="form-grupo">
        <img id="foto-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='400' viewBox='0 0 300 400'><rect width='100%' height='100%' fill='%23111'/><text x='50%' y='50%' fill='%23666' font-size='16' text-anchor='middle'>Aguardando Foto...</text></svg>" alt="Preview">
        
        <div class="campo-item">
          <label>Código Gerado</label>
          <input type="text" id="prod-codigo" readonly>
        </div>

        <div class="campo-item">
          <label>Nome do Produto</label>
          <input type="text" id="prod-titulo" placeholder="Ex: Camiseta Linho">
        </div>

        <div class="campo-item">
          <label>Marca</label>
          <input type="text" id="prod-marca" placeholder="Ex: Beagle">
        </div>

        <div class="campo-item">
          <label>Preço de Venda (R$)</label>
          <input type="text" id="prod-preco" class="input-preco" placeholder="189,90">
        </div>

        <div class="campo-item">
          <label>Tamanhos Disponíveis</label>
          <input type="text" id="prod-tamanhos" placeholder="P, M, G">
        </div>
        
        <button class="btn" style="margin-top: 10px;" onclick="cadastrarEEnviarParaGithub()">🚀 Publicar Produto</button>
      </div>
    </div>
  </div>

  <script src="produtos.js"></script>

  <script>
    let imagemBase64 = '';
    let streamCamera = null;

    window.addEventListener('DOMContentLoaded', () => {
      carregarCredenciais();
      iniciarCamera();
      gerarNovoCodigo();
    });

    function salvarCredenciais() {
      localStorage.setItem('gh_user', document.getElementById('gh-user').value);
      localStorage.setItem('gh_repo', document.getElementById('gh-repo').value);
      localStorage.setItem('gh_token', document.getElementById('gh-token').value);
    }

    function carregarCredenciais() {
      document.getElementById('gh-user').value = localStorage.getItem('gh_user') || '';
      document.getElementById('gh-repo').value = localStorage.getItem('gh_repo') || '';
      document.getElementById('gh-token').value = localStorage.getItem('gh_token') || '';
    }

    async function iniciarCamera() {
      try {
        const video = document.getElementById('webcam');
        streamCamera = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: "environment", width: { ideal: 1080 }, height: { ideal: 1440 } } 
        });
        video.srcObject = streamCamera;
      } catch (err) {
        console.warn("Câmera não disponível ou permissão negada:", err.message);
      }
    }

    function gerarNovoCodigo() {
      document.getElementById('prod-codigo').value = 'RAIZ-' + Math.floor(1000 + Math.random() * 9000);
    }

    function tirarFoto() {
      const video = document.getElementById('webcam');
      const canvas = document.getElementById('canvas');
      const preview = document.getElementById('foto-preview');

      if (!video.videoWidth) {
        alert("Câmera não está pronta ou indisponível.");
        return;
      }

      canvas.width = video.videoWidth || 600;
      canvas.height = video.videoHeight || 800;
      
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      imagemBase64 = canvas.toDataURL('image/jpeg', 0.85);
      preview.src = imagemBase64;
    }

    function carregarFotoArquivo(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        imagemBase64 = e.target.result;
        document.getElementById('foto-preview').src = imagemBase64;
      };
      reader.readAsDataURL(file);
    }

    async function salvarArquivoGithub(user, repo, token, caminho, conteudoBase64, mensagemCommit) {
      const url = `https://api.github.com/repos/${user}/${repo}/contents/${caminho}`;
      
      let sha = undefined;
      try {
        const checagem = await fetch(url, { headers: { 'Authorization': `bearer ${token}` } });
        if (checagem.ok) {
          const dados = await checagem.json();
          sha = dados.sha;
        }
      } catch (e) {}

      const response = await fetch(url, {
        method: 'PUT',
        headers: { 'Authorization': `bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: mensagemCommit, content: conteudoBase64, sha: sha })
      });

      return response.ok;
    }

    async function cadastrarEEnviarParaGithub() {
      const user = document.getElementById('gh-user').value.trim();
      const repo = document.getElementById('gh-repo').value.trim();
      const token = document.getElementById('gh-token').value.trim();

      const codigo = document.getElementById('prod-codigo').value;
      const titulo = document.getElementById('prod-titulo').value || 'Produto Raízes';
      const marca = document.getElementById('prod-marca').value || 'RAÍZES';
      
      const precoInput = document.getElementById('prod-preco').value.replace(',', '.');
      const preco = parseFloat(precoInput) || 0.00;

      const tamanhosBrutos = document.getElementById('prod-tamanhos').value;
      const tamanhos = tamanhosBrutos ? tamanhosBrutos.split(',').map(t => t.trim()) : ["P", "M", "G"];

      if (!user || !repo || !token) {
        alert('Preencha as credenciais do GitHub!');
        return;
      }

      if (!imagemBase64) {
        alert('Selecione uma imagem do dispositivo ou tire uma foto!');
        return;
      }

      alert('Enviando dados para o GitHub...');

      const fotoPura = imagemBase64.replace(/^data:image\/(png|jpeg|jpg);base64,/, "");
      const caminhoFoto = `imagens/${codigo}.jpg`;

      const fotoEnviada = await salvarArquivoGithub(user, repo, token, caminhoFoto, fotoPura, `Upload foto ${codigo}`);

      if (!fotoEnviada) {
        alert('Erro ao enviar a imagem. Verifique se o Token tem permissão de escrita e se Usuário/Repositório estão corretos.');
        return;
      }

      const listaAtual = (typeof listaProdutos !== 'undefined' && Array.isArray(listaProdutos)) ? listaProdutos : [];
      
      const novoProduto = {
        id: Date.now(),
        codigo: codigo,
        titulo: titulo,
        marca: marca,
        preco: preco,
        imagem: caminhoFoto,
        tamanhos: tamanhos,
        cores: ["Padrão"]
      };

      listaAtual.unshift(novoProduto);

      const conteudoProdutosJS = `const listaProdutos = ${JSON.stringify(listaAtual, null, 2)};`;
      const jsBase64 = btoa(unescape(encodeURIComponent(conteudoProdutosJS)));

      const jsEnviado = await salvarArquivoGithub(user, repo, token, 'produtos.js', jsBase64, `Adiciona ${codigo} com preço R$ ${preco}`);

      if (jsEnviado) {
        alert(`Sucesso! O produto ${codigo} (R$ ${preco.toFixed(2)}) foi publicado.`);
        document.getElementById('prod-titulo').value = '';
        document.getElementById('prod-preco').value = '';
        document.getElementById('prod-tamanhos').value = '';
        document.getElementById('foto-preview').src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='400' viewBox='0 0 300 400'><rect width='100%' height='100%' fill='%23111'/><text x='50%' y='50%' fill='%23666' font-size='16' text-anchor='middle'>Aguardando Foto...</text></svg>";
        imagemBase64 = '';
        gerarNovoCodigo();
      } else {
        alert('Foto enviada, mas falhou a gravação no produtos.js.');
      }
    }
  </script>
</body>
</html>
