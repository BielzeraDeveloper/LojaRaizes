<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin — Cadastrar Produtos Raízes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-principal: #050806;
      --bg-card: #0d120f;
      --bg-input: #141b16;
      --borda-suave: rgba(197, 160, 89, 0.2);
      --dourado: #d4af37;
      --texto-primario: #f5f3ef;
      --texto-secundario: #8e9e94;
      --verde-whatsapp: #25d366;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-principal);
      color: var(--texto-primario);
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      font-size: 20px;
      color: var(--dourado);
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .form-card {
      background: var(--bg-card);
      border: 1px solid var(--borda-suave);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .campo {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--texto-secundario);
      letter-spacing: 0.5px;
    }

    input, select {
      background: var(--bg-input);
      border: 1px solid var(--borda-suave);
      color: var(--texto-primario);
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--dourado);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-salvar {
      background: var(--dourado);
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    .btn-salvar:hover {
      background: #ebd47a;
    }

    .btn-salvar:disabled {
      background: #555;
      cursor: not-allowed;
    }

    .status-msg {
      font-size: 12px;
      font-weight: 600;
      padding: 10px;
      border-radius: 6px;
      display: none;
    }

    .status-msg.sucesso {
      background: rgba(37, 211, 102, 0.15);
      color: var(--verde-whatsapp);
      border: 1px solid var(--verde-whatsapp);
      display: block;
    }

    .status-msg.erro {
      background: rgba(255, 77, 77, 0.15);
      color: #ff4d4d;
      border: 1px solid #ff4d4d;
      display: block;
    }

    .status-msg.carregando {
      background: rgba(212, 175, 55, 0.15);
      color: var(--dourado);
      border: 1px solid var(--dourado);
      display: block;
    }

    .area-codigo {
      margin-top: 24px;
      background: var(--bg-card);
      border: 1px solid var(--borda-suave);
      border-radius: 12px;
      padding: 20px;
    }

    textarea {
      width: 100%;
      height: 180px;
      background: var(--bg-input);
      border: 1px solid var(--borda-suave);
      color: #8ebd9e;
      font-family: monospace;
      font-size: 12px;
      padding: 10px;
      border-radius: 6px;
      margin-top: 10px;
      resize: vertical;
    }

    .btn-copiar {
      background: #203e30;
      color: #fff;
      border: 1px solid var(--borda-suave);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <h1>Painel Admin — Cadastro de Produtos</h1>

  <form id="form-produto" class="form-card">
    <div class="campo">
      <label for="titulo">Título do Produto</label>
      <input type="text" id="titulo" placeholder="Ex: Camisa Polo Manga Curta" required>
    </div>

    <div class="grid-2">
      <div class="campo">
        <label for="marca">Marca</label>
        <select id="marca" required>
          <option value="BEAGLE">Beagle</option>
          <option value="BAUMGARTEN">Baumgarten</option>
          <option value="AUROCHS">Aurochs</option>
          <option value="FARM RIO">Farm Rio</option>
          <option value="SOUL">Soul</option>
          <option value="SLY WEAR">Sly Wear</option>
          <option value="HERING">Hering</option>
        </select>
      </div>

      <div class="campo">
        <label for="preco">Preço (R$)</label>
        <input type="number" id="preco" step="0.01" placeholder="Ex: 189.90" required>
      </div>
    </div>

    <div class="grid-2">
      <div class="campo">
        <label for="codigo">Código / Referência (Opcional)</label>
        <input type="text" id="codigo" placeholder="Ex: REF-102">
      </div>

      <div class="campo">
        <label for="tamanhos">Tamanhos (Separados por vírgula)</label>
        <input type="text" id="tamanhos" value="P, M, G, GG">
      </div>
    </div>

    <div class="campo">
      <label for="cores">Cores (Separadas por vírgula)</label>
      <input type="text" id="cores" value="Padrão">
    </div>

    <div class="campo">
      <label for="foto">Selecione a Foto (Será comprimida automaticamente)</label>
      <input type="file" id="foto" accept="image/*" required>
    </div>

    <div id="status" class="status-msg"></div>

    <button type="submit" id="btn-submit" class="btn-salvar">Comprimir e Salvar Produto</button>
  </form>

  <div class="area-codigo">
    <label>Código Gerado (Copie e cole no seu <code>produtos.js</code>)</label>
    <textarea id="saida-json" readonly placeholder="O código JS formatado aparecerá aqui..."></textarea>
    <button class="btn-copiar" onclick="copiarCodigo()">Copiar Código JS</button>
  </div>

  <script>
    const IMGBB_API_KEY = "58bb89f2c226df64c69556056d14d355";

    // Função que reduz e comprima a foto usando Canvas antes de enviar
    function comprimirImagem(file, maxLargura = 800, qualidade = 0.75) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let largura = img.width;
            let altura = img.height;

            if (largura > maxLargura) {
              altura = Math.round((altura * maxLargura) / largura);
              largura = maxLargura;
            }

            canvas.width = largura;
            canvas.height = altura;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, largura, altura);

            canvas.toBlob((blob) => {
              if (blob) resolve(blob);
              else reject(new Error("Erro ao comprimir imagem."));
            }, 'image/jpeg', qualidade);
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    }

    // Envio para o ImgBB
    async function enviarParaImgBB(blobImagem) {
      const formData = new FormData();
      formData.append('image', blobImagem, 'produto.jpg');

      const resposta = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
        method: 'POST',
        body: formData
      });

      const dados = await resposta.json();
      if (dados.success) {
        return dados.data.url;
      } else {
        throw new Error(dados.error.message || "Falha no upload para o ImgBB");
      }
    }

    // Processamento do Formulário
    document.getElementById('form-produto').addEventListener('submit', async (e) => {
      e.preventDefault();

      const statusEl = document.getElementById('status');
      const btnSubmit = document.getElementById('btn-submit');
      const arquivoFoto = document.getElementById('foto').files[0];

      if (!arquivoFoto) return;

      try {
        btnSubmit.disabled = true;
        statusEl.className = 'status-msg carregando';
        statusEl.textContent = '⚡ Comprimindo imagem e enviando para o ImgBB... Aguarde!';

        // 1. Comprime a foto localmente no navegador
        const blobComprimido = await comprimirImagem(arquivoFoto, 800, 0.75);

        // 2. Faz o upload da foto leve
        const urlImagem = await enviarParaImgBB(blobComprimido);

        // 3. Monta o objeto no padrão exato do seu produtos.js
        const titulo = document.getElementById('titulo').value.trim();
        const marca = document.getElementById('marca').value;
        const preco = parseFloat(document.getElementById('preco').value);
        const codigo = document.getElementById('codigo').value.trim();
        const tamanhos = document.getElementById('tamanhos').value.split(',').map(s => s.trim()).filter(Boolean);
        const cores = document.getElementById('cores').value.split(',').map(s => s.trim()).filter(Boolean);

        const novoProduto = {
          id: Date.now(),
          titulo: titulo,
          marca: marca,
          preco: preco,
          imagem: urlImagem,
          tamanhos: tamanhos,
          cores: cores,
          ...(codigo && { codigo: codigo })
        };

        // 4. Exibe o código formatado
        const jsonFormatado = JSON.stringify(novoProduto, null, 2) + ",";
        const textarea = document.getElementById('saida-json');
        textarea.value = jsonFormatado + "\n" + textarea.value;

        statusEl.className = 'status-msg sucesso';
        statusEl.textContent = '✅ Produto cadastrado e imagem comprimida com sucesso!';

        // Limpa campos básicos
        document.getElementById('titulo').value = '';
        document.getElementById('preco').value = '';
        document.getElementById('codigo').value = '';
        document.getElementById('foto').value = '';

      } catch (erro) {
        statusEl.className = 'status-msg erro';
        statusEl.textContent = '❌ Erro: ' + erro.message;
      } finally {
        btnSubmit.disabled = false;
      }
    });

    function copiarCodigo() {
      const textarea = document.getElementById('saida-json');
      if (!textarea.value) return;
      textarea.select();
      document.execCommand('copy');
      alert('Código copiado! Agora cole no seu arquivo produtos.js');
    }
  </script>
</body>
</html>
